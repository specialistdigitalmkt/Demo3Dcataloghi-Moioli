<!-- @dsCard group="Brand" viewport="700x180" name="Motion" subtitle="Two easing curves, 150–300ms, never over 500ms" -->
<link rel="stylesheet" href="../styles.css"><div style="height:180px;background:#fff;padding:20px;display:flex;flex-direction:column;justify-content:center;gap:16px;font-family:'IBM Plex Sans';font-size:13px;color:#3B3F45">
<div style="display:flex;align-items:center;gap:14px"><div id="e1" style="width:14px;height:14px;border-radius:50%;background:#B13733"></div><span>ease — cubic-bezier(.16,1,.3,1) — hover, entrances</span></div>
<div style="display:flex;align-items:center;gap:14px"><div id="e2" style="width:14px;height:14px;border-radius:50%;background:#1D2A44"></div><span>ease-in-out — cubic-bezier(.65,0,.35,1) — symmetric transitions</span></div>
</div>
<script>setInterval(()=>{document.getElementById('e1').animate([{transform:'translateX(0)'},{transform:'translateX(420px)'},{transform:'translateX(0)'}],{duration:2200,easing:'cubic-bezier(.16,1,.3,1)'});document.getElementById('e2').animate([{transform:'translateX(0)'},{transform:'translateX(420px)'},{transform:'translateX(0)'}],{duration:2200,easing:'cubic-bezier(.65,0,.35,1)'});},2300)</script>
